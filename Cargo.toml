[workspace]
members = [
  "crates/domain",
  "crates/app",
  "crates/platform",
  "crates/ui-gpui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

gpui = { git = "https://github.com/zed-industries/zed", rev = "fd90c0af7f021d89e511dd9a5f92d4f04ec29314" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fd90c0af7f021d89e511dd9a5f92d4f04ec29314", features = ["font-kit"] }

[profile.release]
lto = "thin"
codegen-units = 1
