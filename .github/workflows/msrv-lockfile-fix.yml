name: Fix MSRV lockfile

on:
  push:
    branches:
      - agent/m0-review-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m0-review-hardening
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - name: Pin MSRV-compatible home and validate
        run: |
          cargo update -p home --precise 0.5.11
          cargo check --workspace
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/msrv-lockfile-fix.yml
          git commit -m "Pin MSRV-compatible home dependency"
          git push origin HEAD:agent/m0-review-hardening
