name: Generate Cargo lockfile

on:
  push:
    branches:
      - agent/m0-review-hardening

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m0-review-hardening
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and commit lockfile
        run: |
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/generate-lockfile.yml
          git commit -m "Commit Cargo lockfile"
          git push origin HEAD:agent/m0-review-hardening
